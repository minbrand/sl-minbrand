<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização Protegida - Minbrand</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, #1a2a3a, #0d1b28);
            overflow: hidden;
        }

        /* Cabeçalho Personalizado */
        .header {
            background: linear-gradient(135deg, #121f2b, #0a1520);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            border-bottom: 1px solid #2a3b4d;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(to right, #4a9dff, #6de3ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(77, 157, 255, 0.3);
        }

        .client-info {
            text-align: right;
            font-size: 0.95rem;
            color: #a0c4ff;
        }
        
        .client-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 3px;
        }

        /* Barra de Aviso */
        .banner {
            background: linear-gradient(90deg, #ff4d4d, #ff8e53);
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        
        .banner:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: banner-shine 3s infinite;
        }

        /* Container do Iframe */
        .iframe-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #f0f4f8;
        }

        /* Overlay de Proteção */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            background: transparent;
        }

        /* Controles */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: rgba(18, 30, 43, 0.9);
            border-top: 1px solid #2a3b4d;
        }
        
        .control-btn {
            background: linear-gradient(to bottom, #2c3e50, #1a2530);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #3a516e, #243142);
        }
        
        .whatsapp-btn {
            background: linear-gradient(to bottom, #25D366, #128C7E);
        }
        
        .whatsapp-btn:hover {
            background: linear-gradient(to bottom, #2ef379, #15a18f);
        }
        
        .buy-btn {
            background: linear-gradient(to bottom, #ff6b35, #ff3366);
            animation: pulse 2s infinite;
        }
        
        .buy-btn:hover {
            background: linear-gradient(to bottom, #ff7f4d, #ff4779);
            animation: none;
        }

        /* Rodapé */
        .footer {
            background: #0a1520;
            color: #a0c4ff;
            text-align: center;
            padding: 12px;
            font-size: 0.85rem;
            border-top: 1px solid #2a3b4d;
        }
        
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 5rem;
            color: rgba(255,255,255,0.03);
            pointer-events: none;
            z-index: 10;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        @keyframes banner-shine {
            100% {
                left: 100%;
            }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 107, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .client-info {
                text-align: center;
            }
            
            .brand-name {
                font-size: 1.4rem;
            }
            
            .controls {
                flex-wrap: wrap;
            }
            
            .watermark {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Cabeçalho Personalizado -->
    <div class="header">
        <div class="logo-container">
            <img src="https://minbrand.com/images/minbrand-logobranca.png" alt="Minbrand" class="logo">
            <!--<div class="brand-name">MINBRAND</div>-->
        </div>
        <div class="client-info">
           <!---- <div class="client-name">Projeto para: Cliente VIP</div>-->
            <div>Visualização Confidencial</div>
        </div>
    </div>

    <!-- Barra de Aviso -->
    <div class="banner">
        <i class="fas fa-lock"></i> ATENÇÃO: Esta é uma pré-visualização confidencial. O conteúdo é propriedade intelectual da Minbrand.
    </div>

    <!-- Iframe com o Site do Cliente -->
    <div class="iframe-container">
        <div class="watermark">MINBRAND</div>
        <iframe src="./deepseek_html_20250804_6857c3.html" 
                title="Pré-visualização do site"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
        <div class="overlay"></div>
    </div>
    
    <!-- Controles -->
    <div class="controls">
        <!--<button class="control-btn" onclick="location.reload()">
            <i class="fas fa-sync-alt"></i> Recarregar
        </button> -->
        <button class="control-btn buy-btn" onclick="window.open('https://actuspay.com/views/dados_pessoais.php?produto_id=55', '_blank')">
            <i class="fas fa-shopping-cart"></i> 10x de R$49,00
        </button>
        <button class="control-btn whatsapp-btn" onclick="window.open('https://wa.me/5583994066143', '_blank')">
            <i class="fab fa-whatsapp"></i> WhatsApp (83) 9 9406-6143
        </button>
    </div>

    <!-- Rodapé -->
    <div class="footer">
        &copy; 2025 Minbrand. Todos os direitos reservados. Esta pré-visualização é confidencial e destinada exclusivamente ao cliente.
    </div>

    <script>
        // Proteção básica contra clique direito
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Evitar que o iframe seja arrastado
        document.querySelector('iframe').setAttribute('draggable', 'false');
        
        // Adicionar efeito de carregamento
        document.querySelector('iframe').addEventListener('load', function() {
            this.style.opacity = 1;
        });
        
        // Destacar o botão de compra
        const buyBtn = document.querySelector('.buy-btn');
        setInterval(() => {
            buyBtn.style.transform = 'scale(1.05)';
            setTimeout(() => {
                buyBtn.style.transform = 'scale(1)';
            }, 300);
        }, 5000);
    </script>
</body>
</html>
